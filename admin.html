<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Back Office | WebErgon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>

      <header class="topbar">
        <div class="container nav-wrap">
          <a href="index.html" class="brand" aria-label="WebErgon home">
            <span class="brand-mark">W</span>
            <span>WebErgon</span>
          </a>

          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html#services">Services</a>
            <a href="index.html#process">Process</a>
            <a href="team.html">Team</a>
            <a href="index.html#work">Work</a>
            <a href="admin.html">Back Office</a>
          </nav>

          <a href="index.html#contact" class="button button-primary nav-button">Book a call</a>
        </div>
      </header>

      <main>
        <section class="section admin-page">
          <div class="container">
            <div class="admin-panel reveal">
              <div class="admin-header">
                <div>
                  <p class="eyebrow">Back office</p>
                  <h1>Client inquiries</h1>
                </div>
                <button class="button button-secondary" id="refreshButton" type="button">Refresh</button>
              </div>

              <div class="admin-toolbar">
                <label class="search-field">
                  <span>Search</span>
                  <input id="searchInput" type="text" placeholder="Search name, email, company..." />
                </label>
              </div>

              <div class="admin-table-wrap">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Company</th>
                      <th>Message</th>
                      <th>Date</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="submissionsTableBody">
                    <tr>
                      <td colspan="6" class="empty-state">Loading submissions...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container footer-wrap">
          <div class="brand-footer">
            <span class="brand-mark">W</span>
            <span>WebErgon</span>
          </div>
          <p>© <span id="year"></span> WebErgon. All rights reserved.</p>
        </div>
      </footer>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
