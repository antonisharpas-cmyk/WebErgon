         reaches people we hand the link (or the QR) to.
         No scripts at all, no analytics, no cookies.

         Every path below is RELATIVE (../assets/...), not root-relative,
         so the page renders correctly whether it is opened straight off
         the disk during development or served from ergonsite.com/link/. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'" />

    <style>
      /* Same look as ergonsite.com: white and Apple grey, Inter Tight
         headings, Inter text, the ErgonSite blue as the one accent.
         Fonts are self-hosted, so no visitor IP goes to Google. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('../assets/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Inter Tight';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('../assets/fonts/inter-tight-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      :root {
        --ink: #1d1d1f;
        --ink-2: #424245;
        --muted: #6e6e73;
        --soft: #f5f5f7;
        --line: #e5e5ea;
        --blue: #1b3a9e;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }

      body {
        min-height: 100dvh;
        background: #fff;
        color: var(--ink);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        justify-content: center;
        padding: 64px 22px 46px;
        overflow-x: hidden;
      }

      .shell {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        text-align: center;
      }

      /* ---------- head ---------- */
      .head { margin-bottom: 36px; animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
      .head img { width: 210px; height: auto; display: block; margin: 0 auto; }
      .tagline {
        margin-top: 20px;
        font-size: 1.02rem;
        line-height: 1.5;
        color: var(--muted);
      }

      /* ---------- buttons ---------- */
      /* buttons only: an animated parent would trap the fixed pop-up */
      main > .btn { animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
      main > .btn:nth-child(2) { animation-delay: 0.04s; }
      main > .btn:nth-child(3) { animation-delay: 0.08s; }
      main > .btn:nth-child(4) { animation-delay: 0.12s; }
      main > .btn:nth-child(5) { animation-delay: 0.16s; }
      main > .btn:nth-child(7) { animation-delay: 0.2s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        width: 100%;
        min-height: 58px;
        padding: 16px 22px;
        border: 0;
        border-radius: 999px;
        background: var(--soft);
        color: var(--ink);
        text-decoration: none;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }
      .btn + .btn, .btn + label.btn, label.btn + .btn { margin-top: 12px; }
      .btn:hover, .btn:focus-visible { background: #e8e8ed; transform: translateY(-1px); }
      .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
      .btn svg { flex: 0 0 auto; width: 20px; height: 20px; display: block; }

      /* the website: the main action, in the site's black pill */
      .btn-main { background: var(--ink); color: #fff; }
      .btn-main:hover, .btn-main:focus-visible { background: #000; }

      /* contact: the one colour block, ErgonSite blue */
      .btn-contact { margin-top: 22px; background: var(--blue); color: #fff; }
      .btn-contact:hover, .btn-contact:focus-visible { background: #15307f; }

      /* ---------- pop-up (checkbox toggle, no JavaScript) ---------- */
      .vh {
        position: absolute;
        width: 1px; height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 50;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      #contact-toggle:checked ~ .modal { display: flex; }
      .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(10, 12, 20, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        animation: fade 0.22s ease both;
      }
      .sheet {
        position: relative;
        width: 100%;
        max-width: 380px;
        padding: 30px 22px 18px;
        border-radius: 26px;
        background: #fff;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.25);
        text-align: center;
        animation: pop 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pop {
        from { opacity: 0; transform: translateY(16px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }
      .sheet h2 {
        font-family: 'Inter Tight', 'Inter', sans-serif;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: -0.03em;
      }
      .sheet p.lead {
        margin-top: 8px;
        margin-bottom: 22px;
        font-size: 0.9rem;
        line-height: 1.5;
        color: var(--muted);
      }
      /* each channel keeps a hint of its own colour so it is recognisable */
      .m-call svg { color: var(--blue); }
      .m-wa svg { color: #25d366; }
      .m-vi svg { color: #7360f2; }
      .close {
        display: block;
        margin-top: 14px;
        padding: 10px;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--blue);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .close:hover { text-decoration: underline; text-underline-offset: 3px; }

      /* ---------- foot ---------- */
      .foot {
        margin-top: 40px;
        font-size: 0.85rem;
        color: var(--muted);
      }

      @media (max-width: 380px) {
        body { padding: 44px 16px 34px; }
        .head img { width: 180px; }
        .btn { min-height: 54px; font-size: 0.95rem; gap: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
